# Single source of truth for every run. Both GPU machines must use this exact
# file at the same git commit. Change values only via a commit, never locally.

experiment:
  name: anchor
  seed: 3346              # master seed. The seeds below are set equal to it; each feeds
                          # a separate RNG or hash, so they do not interact.
  split_seed: 3346        # dev/test split (stratified by category)
  decoy_seed: 3346        # decoy prices
  call_seed: 3346         # base for per-call Ollama seeds: hash(call_seed, market_id, run).
                          # Same seed in all three conditions, so only the price line differs.
  bootstrap_seed: 3346    # bootstrap resampling in eval/
  dev_fraction: 0.30
  temperature: 0.7
  max_output_tokens: 16   # Ollama num_predict; answer is a single number
  runs:
    dev: 2
    main: 5
    paraphrase: 3

data:
  markets_csv: data/markets.csv
  split_csv: data/split.csv
  fixture_csv: fixtures/dev_markets.csv   # 10 made-up markets for pipeline tests
  created_after: "2025-01-01"
  snapshot_days_before_resolution: 7
  snapshot_price_min: 0.05
  snapshot_price_max: 0.95
  min_volume_usd: null    # TODO(Evan): agree on the threshold
  target_markets: 300
  min_markets: 200

decoy:
  min_gap_points: 20      # decoy must be at least this far from the real price
  low_points: 5           # decoys are whole percentages in [low, high]
  high_points: 95
  output_csv: data/decoys.csv

conditions: [blind, informed, decoy]

models:
  - {name: llama3.2-3b, tag: "llama3.2:3b", family: llama, size: small, machine: aryan-4060}
  - {name: llama3.1-8b, tag: "llama3.1:8b", family: llama, size: large, machine: aryan-4060}
  - {name: qwen2.5-3b,  tag: "qwen2.5:3b",  family: qwen,  size: small, machine: talha-5070}
  - {name: qwen2.5-7b,  tag: "qwen2.5:7b",  family: qwen,  size: large, machine: talha-5070}

ollama:
  host: http://localhost:11434
  request_timeout_s: 120
  version: null           # TODO: fill in from `ollama --version` on both machines

parser:
  retries: 1                    # one retry on unparseable output, then log a failure
  max_failure_rate: 0.10        # dev-set cutoff; above this, replace or drop the model

evaluation:
  anchoring_min_gap_points: 5   # exclude pairs where |shown price - p_blind| < 5 points
  bootstrap_resamples: 2000
  ci_level: 0.95

paths:
  raw_responses: results/raw
  tables: results/tables
  figures: results/figures
